[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-agentic-service-operations-platform"
version = "0.1.0"
description = "Portfolio-grade Healthcare Agentic Service Operations Platform (synthetic NHS-style scenario) demonstrating enterprise business solution architecture across Dynamics 365, Salesforce, Power Platform, Copilot Studio, agentic AI, and Fabric/Power BI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ibraheem Olasupo" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
# Only domains with real, implemented Python code are packaged.
# analytics/ and governance/ are currently documentation-only bounded-context
# placeholders — see their README.md files — and are added here as they gain
# real implementations in later milestones.
include = [
    "ai*",
    "business_process*",
    "copilot*",
    "dynamics365*",
    "salesforce*",
    "integrations*",
    "power_platform*",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = [
    "ai",
    "business_process",
    "copilot",
    "dynamics365",
    "salesforce",
    "integrations",
    "power_platform",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
