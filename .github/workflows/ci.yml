name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, type-check, and test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project (with dev tooling)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy business_process dynamics365 salesforce integrations power_platform ai copilot analytics governance

      - name: Test (pytest)
        run: pytest --cov --cov-report=term-missing

      - name: Governance policy checks
        run: python -m governance.policies

      - name: Deterministic assurance evidence check
        run: |
          python -m governance.evidence
          git diff --exit-code \
            data/synthetic/audit_evidence.json \
            data/synthetic/access_attestations.json \
            reports/governance_summary.json \
            reports/release_assurance.json \
            reports/operational_readiness.md \
            reports/final_assurance_report.md
